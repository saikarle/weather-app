<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheather_App</title>
    <link rel="stylesheet" href="output.css">
    <link rel="icon" type="image/png" href="cloudy.png" />
</head>
<body class="m-0 p-0  bg-gray-800">


<nav class="w-full bg-gray-700 text-white px-5 md:px-12 py-7   items-center  gap-4">
  <div class="md:flex md:justify-between">
    <!-- Logo -->
    <a href="#" class="flex items-center gap-2 shrink-0">
        <span class="text-3xl text-yellow-400">☀</span>
        <span class="text-2xl font-bold">
            Weather<span class="text-yellow-400">.Now</span>
        </span>
    </a>

    <!-- Navigation Links -->
    <div class="hidden md:flex md:justify-between items-center gap-8">
        <a href="#home"
           class="text-yellow-400 hover:text-yellow-300 transition">
            Home
        </a>

        <a href="#forecast"
           class="text-gray-300 hover:text-white transition">
            Forecast
        </a>

        <a href="#about"
           class="text-gray-300 hover:text-white transition">
            About this page 
        </a>
    </div>
    </div>
    
    <!-- Search Bar -->
    <div id="weather-result" class="flex items-center gap-2 bg-gray-800 rounded-full mt-4 hover:text-yellow-400
          transition-all duration-300 ease-out
          hover:-translate-y-1 inline-block px-3 py-2 w-40 sm:w-56 md:w-80">
        <input 
            type="text"
            id="city-input"
            placeholder="Search city..."
            class="bg-transparent outline-none text-white w-full min-w-0 text-sm"
        >
        <button id="search-btn" class="text-yellow-400 hover:text-yellow-300"
                aria-label="Search city">
            <svg xmlns="http://www.w3.org/2000/svg"
                 class="w-5 h-5 shrink-0"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor">
                <circle cx="11" cy="11" r="7"
                        stroke-width="2"/>
                <path d="m16 16 4 4"
                      stroke-width="2"
                      stroke-linecap="round"/>
            </svg>
        </button>
    </div>

</nav>    

<div class="flex justify-center  mt-5">

    <div class="w-full flex justify-center  max-w-md aspect-square bg-white/10 backdrop-blur-lg border border-white/15 rounded-[1.25rem] shadow-[0_8px_32px_rgba(0,0,0,0.3)] overflow-y-auto p-5 text-white">
        <div id="weather-result" class="w-full h-full   rounded-2xl shadow-lg overflow-y-auto p-5">

             <!-- Location -->
        <div class="flex items-center relative gap-2 text-sm font-semibold text-slate-100 mb-4">
            <span >🏠</span>
            <span id="location"></span>
            <button class="ml-2 px-3 py-1 text-xs text-blue-300 border relative border-slate-600 rounded-full hover:bg-slate-700 transition">
                📍 Use precise location
            </button>
        </div>

           <!-- Top: current weather + side info + day info -->
        <div class="flex justify-between items-start  gap-4 flex-wrap">

            <div class="flex items-center gap-3">
                <div id="nature" class="h-7" >s</div>
                <div id="symbol" class="text-6xl"></div>
                <div>
                    <div class="flex items-start gap-1">
                        <span id="temp" class="text-6xl font-normal text-slate-100 leading-none"></span>
                        <div class="text-sm mt-1">
                            <span class="text-slate-100">°C</span>
                            <span class="text-slate-500">| °F</span>
                        </div>
                    </div>
                </div>
                <div  class="text-xs leading-5 text-slate-300">
                    <div id="pre">Precipitation: </div>
                    <div id="hum">Humidity: </div>
                    <div id="win">Wind: </div>
                </div>
            </div>

            <div class="text-right">
                <div class="text-2xl text-slate-100">Weather</div>
                <div id="day" class="text-sm text-slate-300"><span id="time"></span></div>
                <div id="mood" class="text-sm text-slate-400">Mostly sunny</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-4 text-sm mt-6 border-b border-slate-700">
            <button class="pb-2 text-slate-100 border-b-2 border-amber-400">Temperature</button>
            <button class="pb-2 text-slate-400 hover:text-slate-200">Precipitation</button>
            <button class="pb-2 text-slate-400 hover:text-slate-200">Wind</button>
        </div>


        </div>
    </div>
    
</div>



</body>
<script src="script.js"></script>
</html>
